<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Update Stock — Admin</title>
  <link rel="stylesheet" th:href="@{/css/style.css}" href="/css/style.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <a class="logo" th:href="@{/home}" href="/home">SRZ</a>
        <div>
          <h1>Update Stock</h1>
          <p class="lead">Add multiple stock entries and review recent receipts</p>
        </div>
      </div>
      <div style="margin-left:auto;display:flex;gap:12px;align-items:center">
        <a class="btn" th:href="@{/admin}" href="/admin">Back</a>
        <a th:if="${username != null}" th:href="@{/logout}" class="btn logout" aria-label="Logout">Logout</a>
      </div>
    </header>

    <div style="display:flex;gap:20px;margin-top:18px;align-items:flex-start">
      <aside style="width:220px;">
        <nav style="display:flex;flex-direction:column;gap:10px">
          <a class="btn" th:href="@{/admin}">Dashboard</a>
          <a class="btn" th:href="@{/}" href="/">Public site</a>
          <a class="btn" th:href="@{/admin}" href="/admin">Products</a>
          <a class="btn" style="background:transparent;text-align:left" th:href="@{/admin/stock}" href="/admin/stock">Update stock</a>
          <a class="btn" th:href="@{/admin/products/import}" href="/admin/products/import">Import CSV</a>
        </nav>
      </aside>

      <main style="flex:1">
        <section style="margin-bottom:18px">
          <form id="stockForm" th:action="@{/admin/stock/update}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div id="rows" style="display:flex;flex-direction:column;gap:10px">
              <!-- template row -->
              <div class="stock-row" style="display:flex;gap:8px;align-items:center">
                <select name="productId" required>
                  <option value="">Select product</option>
                  <option th:each="p : ${products}" th:value="${p.id}" th:text="${p.name + ' — ' + p.code}"></option>
                </select>
                <input type="number" name="quantity" placeholder="Qty" min="1" required style="width:90px" />
                <input type="number" step="0.01" name="unitPrice" placeholder="Unit price" required style="width:120px" />
                <input type="text" name="supplier" placeholder="Supplier" style="width:160px" />
                <input type="date" name="arrivalDate" style="width:140px" />
                <button type="button" class="btn" onclick="removeRow(this)">Remove</button>
              </div>
            </div>

            <div style="display:flex;gap:10px;margin-top:12px">
              <button type="button" class="btn" onclick="addRow()">Add another</button>
              <button type="submit" class="btn primary">Submit stock entries</button>
            </div>
          </form>
        </section>

        <section>
          <h3>Recent stock entries</h3>
          <table style="width:100%;border-collapse:collapse;margin-top:8px">
            <thead>
              <tr style="text-align:left;border-bottom:1px solid #e6eef0">
                <th style="padding:8px">#</th>
                <th style="padding:8px">Product</th>
                <th style="padding:8px">Qty</th>
                <th style="padding:8px">Unit price</th>
                <th style="padding:8px">Total</th>
                <th style="padding:8px">Supplier</th>
                <th style="padding:8px">Arrival</th>
                <th style="padding:8px">Received</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="s,iter : ${stocks}" style="border-bottom:1px solid #f0f0f0">
                <td style="padding:8px" th:text="${iter.index + 1}">1</td>
                <td style="padding:8px" th:text="${s.product.name}">Product</td>
                <td style="padding:8px" th:text="${s.quantity}">0</td>
                <td style="padding:8px" th:text="${s.unitPrice}">0</td>
                <td style="padding:8px" th:text="${s.totalPrice}">0</td>
                <td style="padding:8px" th:text="${s.supplier}">Supplier</td>
                <td style="padding:8px" th:text="${s.arrivalDate}">-</td>
                <td style="padding:8px" th:text="${s.createdDate}">-</td>
              </tr>
            </tbody>
          </table>
        </section>
      </main>
    </div>
  </div>

  <script>
    function addRow(){
      const container = document.getElementById('rows');
      const template = container.querySelector('.stock-row');
      const clone = template.cloneNode(true);
      // clear values
      clone.querySelectorAll('input').forEach(i=>i.value='');
      clone.querySelector('select').selectedIndex = 0;
      container.appendChild(clone);
    }
    function removeRow(btn){
      const row = btn.closest('.stock-row');
      const container = document.getElementById('rows');
      if(container.querySelectorAll('.stock-row').length > 1) row.remove();
    }
    // ensure when submitting, each row's inputs are submitted as arrays by giving identical names
    // Thymeleaf already renders names like productId, quantity etc. as repeated fields which Spring binds to List<> params.
  </script>
</body>
</html>
